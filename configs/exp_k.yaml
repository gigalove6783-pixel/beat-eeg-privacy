# Experiment K (EXPLORATORY): user identity in decoded motor-imagery command streams,
# stronger attackers, information accounting, randomized response (RR) versus
# g-indistinguishable equalized decoding (EQ). No confirmatory claims.
# Plan: .mixdog/plan_v2.md revision 4, lane K. Only already-accessed data:
# BCI IV 2a (T = calibration day, E = deployment day) and Lee2019 (session 1 =
# calibration day, session 2 = deployment day).
status: exploratory
seed: 20261111                    # root of every post-processing / simulation seed
workers: 3                        # attack-battery processes (one heavy job; RAM gate below)
memory:
  reserve_mib: 8192               # keep >= 8 GB physical memory free
  per_worker_mib: 700             # ~2x the measured 331 MiB RSS of an imported beat process
  wait_seconds: 900               # below the reserve, wait up to this long before stopping
runtime:
  limit_seconds: 10800            # 3 h wall including the timing pilot
  safety_factor: 1.25             # projection multiplier before comparing with the limit
command:
  # Experiment C's rule (beat.exp_c.decide): temperature-scaled max probability < tau -> hold.
  taus: [0.5, 0.8]
datasets:
  bnci2014_001:
    label: 2a
    users: 9
    # K condition -> stored Experiment-B setting key (P2-RC uses B's d = 8 bottleneck;
    # P3 lambda = 1 = artifacts/exp_b/dev/oof/P3_lambda1 and artifacts/exp_b/final/P3_lambda1).
    conditions: {P0: P0, P2-RC_d8: P2-RC, P3_lambda1: P3_lambda1}
    segment_runs: 3               # segment 1 = runs 1-3, segment 2 = runs 4-6 (E halves)
    k: [1, 2, 5, 10, 20, 36, 72]
    battery_k: [1, 5, 20, 36]     # battery needs >= inner_folds training windows per user
    # desc_2a.pdf: fixation t = 0, cue t = 2 s, imagery until t = 6 s, then an unspecified
    # short break -> 6 s is a minimum cycle and the ITR an upper bound.
    trial_seconds: 6.0
  lee2019:
    label: L
    users: 54
    conditions: {P0: P0, P2-RC_d8: P2-RC_d8, P3_lambda1: P3_lambda1}
    segment_runs: 2               # segment 1 = offline phase (blocks 1-2), 2 = online phase
    k: [1, 2, 5, 10, 20, 50, 100]
    battery_k: [1, 5, 20, 50]
    # Lee et al. 2019: 3 s fixation + 4 s imagery + 6 +/- 1.5 s blank = 13 s nominal cycle.
    trial_seconds: 13.0
model_seeds: [0, 1, 2]
undefended_only: [P3_lambda1]
defences:
  postprocessing_seeds: [0, 1, 2]
  # k-ary randomized response: keep the command with prob. 1 - q, else a uniform draw
  # from {left, hold, right}; epsilon = ln((1 - q + q/3) / (q/3)) per command.
  rr_q: [0.1, 0.25, 0.5, 0.75]
  eq_variants: [marginal, confusion]
  eq_g: [2, 3, 5, 9, all]         # 2a: 9 = all; groups by sorted calibration net progress
  eq_smoothing: 0.5               # pseudo-count per (target, command) cell of the LP input
  target_prior: [0.5, 0.5]        # assumed i.i.d. user-independent targets
  # EQ LP objective: weighted utility P(correct) - w P(wrong), w = tau / (1 - tau) (the
  # wrong-move cost implied by the hold rule; net progress at tau = 0.5). Groups stay
  # formed by calibration net progress.
  # Cross-fitting of the calibration-day (cross-day enrolment) stream: contiguous per-user
  # blocks; each block is post-processed by matrices fitted on the other blocks.
  eq_crossfit_folds: 5
attackers:
  bayes: [cat_blind, cat_aware, markov_blind, markov_aware]
  dirichlet_alpha: 0.5            # symmetric Dirichlet prior of the Bayes attackers
  battery: [logistic, rbf_svm, mlp]   # 2a: configs/exp_b.yaml settings; L: configs/exp_l.yaml
  views: [blind, aware]
  enrolment_sizes: [5, 20]        # deployment-aware enrolment k_e (Bayes, within-day)
scenarios:
  within_day: deployment-day segment A -> segment B, both directions (C/L "main")
  cross_day: cross-fitted calibration day -> deployment day (C/L "auxiliary")
  cross_day_insample: in-sample calibration day -> deployment day (contrast only)
# Battery cells beyond the undefended grid ("full set again at the chosen operating
# points"); fixed before any defended result was computed.
operating_points:
  defences: [rr_q0.5, eqm_g3, eqc_g3]
  conditions: [P0, P2-RC_d8]
  postprocessing_seeds: [0]
statistics:
  confidence: 0.95                # participant t-intervals (descriptive)
  permutations: 20                # permutation-null bias correction of plug-in MI
  residual_replicates: 5          # no-drift simulation replicates per EQ cell
  k_reference: 20
# Applied in order while the projected runtime exceeds the limit (written to drop_list.csv).
cut_order:
  - battery_operating_points
  - battery_insample_contrast
  - battery_P3_lambda1
  - battery_aware_view_k_ge_20
  - battery_seeds_1_2
  - bayes_enrolment_sweep
  - power_grid_reduced
power:
  # Simulation design of M (Yang2025 WBCIC-SHU): N users, sessions on separate days.
  n_users: 51
  trials_per_session: 200
  days: 3
  channels: 19                    # informational; enters only through the effect model
  calibration_sources:            # K cross-fitted streams used to calibrate the effect model
    - {dataset: lee2019, condition: P2-RC_d8, tau: 0.8}
    - {dataset: lee2019, condition: P0, tau: 0.8}
    - {dataset: lee2019, condition: P2-RC_d8, tau: 0.5}
  calibration_k: [5, 20, 50]
  calibration_attackers: [cat_blind, cat_aware]
  calibration_replicates: 8
  shrink_grid: [0.3, 0.45, 0.6, 0.75, 0.9, 1.0]
  drift_grid: [0.0, 0.1, 0.2, 0.3, 0.45, 0.6, 0.8]
  effect_multipliers: [0.75, 1.0]  # sensitivity: scale of the calibrated between-user spread
  k_grid: [5, 10, 20, 50, 100]
  g_grid: [2, 3, 5]
  m_grid: [0.02, 0.03, 0.05, 0.075, 0.1]
  delta_grid: [0.02, 0.05, 0.1, 0.15]
  n_sim: 200
  n_sim_final: 400                # projection budget only; power_decision_rule.csv is read
                                  # from the power_m3/power_m4 grids (no separate stage)
# Decision rule that M0 adopts (or reruns power_function with its final rule; recorded).
# Statistic = maximum over the attacker x scenario candidate set (L's sealed maximum):
# M3 p = min(1, J min_j max{T(c[K*, j], 2/N), max_l T(c[K*, j] - c[1, l], 0)});
# M4 p = max{max_j T<(D_j, m), min(1, J min_j max_l T(D0_j - D_l, Delta)), T<(loss, 0.02)}
# with D = mean over users of (within-group identification - 1/|own group|), loss = mean
# weighted-utility loss at the rule's tau.
decision_rule:
  attackers: [cat_blind, cat_aware, markov_blind, markov_aware]
  scenarios: [cal_to_dep, dep_to_dep]
  statistic: max_over_candidates
  k_star: 20
  k_base: 1
  threshold_factor: 2.0           # M3 threshold = 2/N
  holm_family: 3                  # M1, M3, M4 (M2 deferred); power uses alpha / family
  alpha: 0.05
  eq_variant: confusion
  g_star: 3
  m: 0.05
  delta: 0.05
  utility_loss_max: 0.02          # weighted-utility loss (w = tau / (1 - tau)) per trial
  tau: 0.8
