# Plan v3 stage S2 exports: BEAT's stored per-trial outputs -> beat_audit input files
# (docs/plan_v3.md §3 "Input" and "Protocol", §4 "Rungs exported per cohort"). Export only.
#   .venv\Scripts\python.exe scripts/audit_cohorts.py --config configs/audit.yaml
threads: 4                          # plan §4: at most 4 BLAS/OpenMP threads per job
# Output destinations must resolve under artifacts/audit/ or results/audit/ (else the run stops).
inputs_dir: artifacts/audit/inputs  # one .npz (+ .trials.csv key sidecar) per rung, tau and seed
manifest: results/audit/export_manifest.json
utility: results/audit/utility.csv
checks: results/audit/export_checks.json
results_dir: results/audit          # reports: {results_dir}/{cohort}/{rung}/report.json
summary: results/audit/summary.csv
attempts: results/audit/attempts.jsonl
parity: results/audit/parity.json
runtime: results/audit/runtime_projection.json
v1_selection: results/audit/v1_selection.json
jobs_draft: results/audit/jobs_draft.json
freeze_dir: results/audit/freeze
batch_lock: artifacts/audit/frozen_batch.lock  # OS lock: one frozen batch or recovery at a time
command_records: artifacts/exp_k/command_records.csv.gz
stream_summary: results/exp_k/stream_summary.csv
code_map: {-1: 1, 0: 0, 1: 2}       # stored -1 left, 0 hold, +1 right -> audit code (plan §3)
alphabet_size: 3
code_labels: {0: hold, 1: left, 2: right}
k_grid: [1, 5, 10, 20, 50, 100]     # plan §3 window lengths; used only to list short segments
max_excluded_share: 0.10            # plan §3: a cell above this share of excluded users is not evaluable
cohorts:
  bnci2014_001:
    days: {T: 1, E: 2}              # session -> day label
    day_labels: {1: "session T (calibration)", 2: "session E (deployment)"}
    deployment_days: [2]
    segment_runs: 3                 # segment 1 = runs 1-3, 2 = runs 4-6 of each session
    segment_labels: {1: "runs 1-3", 2: "runs 4-6"}
    outputs: "artifacts/exp_b/final/{key}/seed{seed}_outputs.npz"
    task_reference: results/exp_b/task_final.csv
    features:
      P0: {key: P0, seeds: [0, 1, 2, 3, 4]}
      P2-RC_d8: {key: P2-RC, seeds: [0, 1, 2, 3, 4]}
    commands: {condition: P2-RC_d8, key: P2-RC, taus: [0.5, 0.8], seeds: [0, 1, 2],
               sources: {cal_oof: 1, dep: 2}}
    seconds_per_output:
      value: 6.0
      source: "configs/exp_k.yaml datasets.bnci2014_001.trial_seconds (desc_2a.pdf: cue at 2 s,
        imagery until 6 s, then an unspecified short break; a minimum cycle)"
  lee2019:
    days: {T: 1, E: 2}
    day_labels: {1: "session 1 (calibration)", 2: "session 2 (deployment)"}
    deployment_days: [2]
    phases: {train: 1, test: 2}     # phase -> segment: offline (runs 1-2), online (runs 3-4)
    segment_labels: {1: "offline phase", 2: "online phase"}
    outputs: "artifacts/exp_l/outputs_{key}_{seed}.joblib"
    task_reference: results/exp_l/task.csv
    features:
      P0: {key: P0, seeds: [0, 1, 2, 3, 4]}
      P2-RC_d8: {key: P2-RC_d8, seeds: [0, 1, 2, 3, 4]}
    commands: {condition: P2-RC_d8, key: P2-RC_d8, taus: [0.5, 0.8], seeds: [0, 1, 2],
               sources: {cal_oof: 1, dep: 2}}
    seconds_per_output:
      value: 13.0
      source: "configs/exp_k.yaml datasets.lee2019.trial_seconds (Lee et al. 2019: 3 s fixation
        + 4 s imagery + 6 +/- 1.5 s blank = 13 s nominal cycle)"
  yang2025:
    exp_m_config: configs/exp_m.yaml  # data_dir, subjects, segment_trials, tau_star, threads
    selection: results/exp_m/selection.json
    artifacts: artifacts/exp_m
    models: "artifacts/exp_m/final/model_{key}_{seed}.joblib"
    model_keys: [P0, P2-RC_d8, P3_lambda1]  # all nine final models are hashed; P3 is not exported
    model_seeds: [0, 1, 2]
    dev_p0_features: artifacts/exp_m/dev_p0_features.joblib
    task_reference: results/exp_m/final_task.csv
    dev_streams: results/exp_m/dev_streams.csv
    final_utility: results/exp_m/final_estimates_utility.csv
    day_labels: {1: "day 1 (calibration)", 2: "day 2 (deployment)", 3: "day 3 (deployment)"}
    deployment_days: [2, 3]
    segment_labels: {1: "trials 1-100", 2: "trials 101-200"}
    features:
      P0: {days: [1, 2, 3], seeds: [0, 1, 2]}     # tangent reference fitted on day 1 (M1)
      P2-RC_d8: {days: [2, 3], seeds: [0, 1, 2]}  # day 1 is the encoder's training day
    commands: {condition: P2-RC_d8, taus: [0.60, 0.5], seeds: [0, 1, 2]}
    seconds_per_output:
      value: 8.0
      source: "docs/preregistration_m.md (Yang2025 data record): observed onset-to-onset interval
        within runs 7.996-8.007 s, per-user median 8.000-8.007 s (fixed 8.0 s trial spacing)"

# ---- audits (plan §3 Protocol, §4 Runtime gate, Freeze, Attempts); `pilot`, `develop`, `freeze`
audit:
  settings:                         # beat_audit.AuditConfig (plan §3 defaults)
    k_grid: [1, 5, 10, 20, 50, 100]
    fold_seed: 20261111
    seed: 20261112
    permutations: 10000
    bootstraps: 2000
    threads: 4
    # plan §3 (change of 2026-11-11): mean and rich window summaries; listed in the simplicity
    # order of the V1 rule, so the tool's post-hoc "strongest" also breaks exact ties that way
    comparators: [cosine, lda_cosine, cosine_rich, lda_cosine_rich, pair_logistic]
    gallery: true
    sequential: true
    closed_set: true
  # Runtime-gate outcome (results/audit/runtime_projection.json, a prefix of the plan §4 order):
  # pilot 2026-11-11 on beat_audit 73ce3bec projected Yang2025 P0 at 54.7 min with every
  # comparator; the development run (full features x1.45) put it at 79.0 min > 60, so the gate
  # applied drop_pair_logistic (P0 58.4 min, batch 1.06 h after the development adjustment)
  reductions: [drop_pair_logistic]
  max_parallel_jobs: 2
  limits: {stream_minutes: 60, stream_gb: 8, yang2025_batch_hours: 3}  # plan change 2026-11-11
  day_order:                        # chronological export day labels, given to every audit
    bnci2014_001: [1, 2]            # session T, session E
    lee2019: [1, 2]                 # session 1, session 2
    yang2025: [1, 2, 3]             # a stream passes the days it holds, in this order
  pilot_rungs: [features_P0, features_P2-RC_d8, commands_P2-RC_d8_tau0.50]  # Lee2019, fold 0
  # Physical sides: "d" = every segment of day d, "d/s" = segment s of day d (export labels).
  # Side A is the first segment or the earlier day; both directions are scored by the tool.
  conditions:
    bnci2014_001:
      same-day:                     # runs 1-3 against 4-6, within session T and within E
        relation: same-day
        pairs: [{a: ["1/1"], b: ["1/2"]}, {a: ["2/1"], b: ["2/2"]}]
      cross-day:                    # session T against session E
        relation: cross-day
        pairs: [{a: ["1"], b: ["2"]}]
    lee2019:
      same-day:                     # offline against online phase, within session 1 and 2
        relation: same-day
        pairs: [{a: ["1/1"], b: ["1/2"]}, {a: ["2/1"], b: ["2/2"]}]
      cross-day:                    # session 1 against session 2
        relation: cross-day
        pairs: [{a: ["1"], b: ["2"]}]
    yang2025:
      cross-day:                    # primary (V1, V2): day 1 against days 2-3 as one block
        relation: cross-day
        pairs: [{a: ["1"], b: ["2", "3"]}]
      cross-day-d2-d3:              # additional estimate
        relation: cross-day
        pairs: [{a: ["2"], b: ["3"]}]
      same-day:                     # trials 1-100 against 101-200 of each day
        relation: same-day
        pairs: [{a: ["1/1"], b: ["1/2"]}, {a: ["2/1"], b: ["2/2"]}, {a: ["3/1"], b: ["3/2"]}]
      same-day-d2-d3:               # the pre-specified contrast's same-day side (days 2 and 3)
        relation: same-day
        pairs: [{a: ["2/1"], b: ["2/2"]}, {a: ["3/1"], b: ["3/2"]}]
  rung_conditions:                  # default: every condition of the cohort
    yang2025:
      features_P2-RC_d8: [same-day-d2-d3, cross-day-d2-d3]  # exported on days 2-3 only
  day1_notes:                       # summary label of cells that use day 1 of these rungs
    bnci2014_001:
      features_P0: "in-sample: session T (day 1) fitted the tangent reference"
      features_P2-RC_d8: "in-sample: session T (day 1) is the P2-RC encoder's training session"
    lee2019:
      features_P0: "in-sample: session 1 (day 1) fitted the tangent reference"
      features_P2-RC_d8: "in-sample: session 1 (day 1) is the P2-RC encoder's training session"
    yang2025:
      features_P0: "in-sample: day 1 fitted the tangent reference (M1)"

predictions:                        # plan §4: Yang2025, Holm family of two at alpha
  alpha: 0.05
  V1:
    cohort: yang2025
    rung: features_P0
    condition: cross-day
    k: 20
    # Named by the rule below from the Lee2019 development run on the repaired tool
    # (results/audit/v1_selection.json, beat_audit 73ce3bec): cosine 0.9442, lda_cosine 0.9521,
    # cosine_rich 0.9543, lda_cosine_rich 0.9459; pair_logistic (0.8754 in the development run)
    # removed by the runtime gate.
    comparator: cosine_rich
    test: "mean per-user AUC > 0.5, matching permutation test"
    selection:
      cohort: lee2019
      rung: features_P0
      condition: cross-day
      k: 20
      order: [cosine, lda_cosine, cosine_rich, lda_cosine_rich, pair_logistic]
      rule: "highest Lee2019 cross-day mean per-user AUC on full features (P0) at k = 20 over
        the feature comparators that survive the runtime gate; an exact tie goes to the simpler
        comparator in the order cosine, LDA + WCCN, cosine (rich summary), LDA + WCCN (rich
        summary), pairwise logistic"
  V2:
    cohort: yang2025
    rung: commands_P2-RC_d8_tau0.60
    condition: cross-day
    k: 50
    comparator: bayes_factor        # cue-aware: the command exports carry the cue (target)
    test: "mean per-user AUC > 0.5, matching permutation test"
  estimate:                         # paired contrast, V1's comparator and k; no verdict
    cohort: yang2025
    rung: features_P0
    same_day: same-day-d2-d3
    cross_day: cross-day

freeze_expect: {exports: 88, yang2025_archives: 153, final_models: 9, day1_crossfitted: 9}

parity_check:                       # plan §5 A3: the tool's closed-set module on study L's data
  outputs: "artifacts/exp_l/outputs_P0_{seed}.joblib"
  seeds: [0, 1, 2, 3, 4]
  tolerance: 0.01
  identity_summary: results/exp_l/identity_summary.csv
  study_config: configs/exp_l.yaml
  registered:
    within_day: {id: L_P0_within_day}
    cross_day: {id: L_P0_cross_day_logistic}
