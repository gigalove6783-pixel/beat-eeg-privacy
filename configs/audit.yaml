# Plan v3 stage S2 exports: BEAT's stored per-trial outputs -> beat_audit input files
# (docs/plan_v3.md §3 "Input" and "Protocol", §4 "Rungs exported per cohort"). Export only.
#   .venv\Scripts\python.exe scripts/audit_cohorts.py --config configs/audit.yaml
threads: 4                          # plan §4: at most 4 BLAS/OpenMP threads per job
# Output destinations must resolve under artifacts/audit/ or results/audit/ (else the run stops).
inputs_dir: artifacts/audit/inputs  # one .npz (+ .trials.csv key sidecar) per rung, tau and seed
manifest: results/audit/export_manifest.json
utility: results/audit/utility.csv
checks: results/audit/export_checks.json
command_records: artifacts/exp_k/command_records.csv.gz
stream_summary: results/exp_k/stream_summary.csv
code_map: {-1: 1, 0: 0, 1: 2}       # stored -1 left, 0 hold, +1 right -> audit code (plan §3)
alphabet_size: 3
code_labels: {0: hold, 1: left, 2: right}
k_grid: [1, 5, 10, 20, 50, 100]     # plan §3 window lengths; used only to list short segments
max_excluded_share: 0.10            # plan §3: a cell above this share of excluded users is not evaluable
cohorts:
  bnci2014_001:
    days: {T: 1, E: 2}              # session -> day label
    day_labels: {1: "session T (calibration)", 2: "session E (deployment)"}
    deployment_days: [2]
    segment_runs: 3                 # segment 1 = runs 1-3, 2 = runs 4-6 of each session
    segment_labels: {1: "runs 1-3", 2: "runs 4-6"}
    outputs: "artifacts/exp_b/final/{key}/seed{seed}_outputs.npz"
    task_reference: results/exp_b/task_final.csv
    features:
      P0: {key: P0, seeds: [0, 1, 2, 3, 4]}
      P2-RC_d8: {key: P2-RC, seeds: [0, 1, 2, 3, 4]}
    commands: {condition: P2-RC_d8, key: P2-RC, taus: [0.5, 0.8], seeds: [0, 1, 2],
               sources: {cal_oof: 1, dep: 2}}
    seconds_per_output:
      value: 6.0
      source: "configs/exp_k.yaml datasets.bnci2014_001.trial_seconds (desc_2a.pdf: cue at 2 s,
        imagery until 6 s, then an unspecified short break; a minimum cycle)"
  lee2019:
    days: {T: 1, E: 2}
    day_labels: {1: "session 1 (calibration)", 2: "session 2 (deployment)"}
    deployment_days: [2]
    phases: {train: 1, test: 2}     # phase -> segment: offline (runs 1-2), online (runs 3-4)
    segment_labels: {1: "offline phase", 2: "online phase"}
    outputs: "artifacts/exp_l/outputs_{key}_{seed}.joblib"
    task_reference: results/exp_l/task.csv
    features:
      P0: {key: P0, seeds: [0, 1, 2, 3, 4]}
      P2-RC_d8: {key: P2-RC_d8, seeds: [0, 1, 2, 3, 4]}
    commands: {condition: P2-RC_d8, key: P2-RC_d8, taus: [0.5, 0.8], seeds: [0, 1, 2],
               sources: {cal_oof: 1, dep: 2}}
    seconds_per_output:
      value: 13.0
      source: "configs/exp_k.yaml datasets.lee2019.trial_seconds (Lee et al. 2019: 3 s fixation
        + 4 s imagery + 6 +/- 1.5 s blank = 13 s nominal cycle)"
  yang2025:
    exp_m_config: configs/exp_m.yaml  # data_dir, subjects, segment_trials, tau_star, threads
    selection: results/exp_m/selection.json
    artifacts: artifacts/exp_m
    models: "artifacts/exp_m/final/model_{key}_{seed}.joblib"
    model_keys: [P0, P2-RC_d8, P3_lambda1]  # all nine final models are hashed; P3 is not exported
    model_seeds: [0, 1, 2]
    dev_p0_features: artifacts/exp_m/dev_p0_features.joblib
    task_reference: results/exp_m/final_task.csv
    dev_streams: results/exp_m/dev_streams.csv
    final_utility: results/exp_m/final_estimates_utility.csv
    day_labels: {1: "day 1 (calibration)", 2: "day 2 (deployment)", 3: "day 3 (deployment)"}
    deployment_days: [2, 3]
    segment_labels: {1: "trials 1-100", 2: "trials 101-200"}
    features:
      P0: {days: [1, 2, 3], seeds: [0, 1, 2]}     # tangent reference fitted on day 1 (M1)
      P2-RC_d8: {days: [2, 3], seeds: [0, 1, 2]}  # day 1 is the encoder's training day
    commands: {condition: P2-RC_d8, taus: [0.60, 0.5], seeds: [0, 1, 2]}
    seconds_per_output:
      value: 8.0
      source: "docs/preregistration_m.md (Yang2025 data record): observed onset-to-onset interval
        within runs 7.996-8.007 s, per-user median 8.000-8.007 s (fixed 8.0 s trial spacing)"
