# Fixed before any Experiment-B E evaluation. CPU-only; no E-driven tuning.
seeds: [0, 1, 2, 3, 4]
lambdas: [0.01, 0.03, 0.1, 0.3, 1.0, 3.0]
workers: 4
torch_threads: 1
training:
  optimizer: adam
  learning_rate: 0.001
  weight_decay: 0.0
  batch_size: 128
  max_epochs: 40
  checkpoint_interval: 1
  encoder_hidden: 64
  bottleneck: 8
  identity_hidden: 16
  linear_C: 1.0
  linear_max_iter: 2000
attackers:
  logistic_C: 1.0
  logistic_max_iter: 2000
  svm_C: [0.1, 1.0, 10.0]
  svm_gamma: [scale, 0.01, 0.1]
  inner_folds: 3
  mlp_hidden: [32]
  mlp_alpha: 0.01
  mlp_solver: lbfgs
  mlp_max_iter: 50000
  mlp_max_fun: 1000000
statistics:
  bootstrap_samples: 2000
  confidence: 0.95
  utility_margin: 0.05
  protection_drop: 0.05
  chance: 0.1111111111111111
  # The plan leaves "at chance" operationalization open: withhold whenever
  # P0's strongest mean BA is <= theoretical chance (no significance gate).
  baseline_at_chance: strongest_mean_le_chance
  # Both task selection and reporting weight subjects equally.
  task_aggregation: subject_mean
