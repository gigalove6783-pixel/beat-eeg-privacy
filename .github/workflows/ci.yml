name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows is where the experiments ran; Linux checks portability of everything else.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      # Full history and tags: the seal-manifest check walks every commit after each seal.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # requirements.txt pins torch==...+cpu and adds the PyTorch CPU index, so no CUDA wheels.
      # bash (-e) on both systems: Windows pwsh would only check the last command's exit code.
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps

      # Sealed files are excluded in pyproject.toml ([tool.ruff] extend-exclude).
      - name: Lint
        run: ruff check .

      # (a) seal manifest against the Git history and working tree, (b) registered numbers
      # against their result files. Needs no EEG data.
      - name: Verify seals and numbers
        run: python -m beat.verify

      # No dataset is ever downloaded: tests marked `data` are deselected; all others use
      # synthetic signals generated inside pytest's temporary directories.
      - name: Run tests
        run: python -m pytest -m "not data" -ra --durations=10
