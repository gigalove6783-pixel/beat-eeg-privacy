# Registry of headline numbers, checked by `python -m beat.verify --numbers` (also run in CI).
#
# Each entry names the result file the number comes from (`value`: a CSV row filter and column, or
# a dotted JSON path; `agg` takes the min or max over the filtered rows), how the documents print it
# (`format`: fixed decimals, optionally scaled, or scientific notation) and the exact `text`.
# The check recomputes the value, renders it and requires `text` to match; each snippet under `in`
# must contain `text` and occur verbatim in that document (snippets stay within one line); each
# `demo` value must equal the source value within `tolerance` (demo data are rounded to 6 places).
# Later lanes add their numbers here; documents they do not own are checked read-only.

numbers:
  # ---------------------------------------------------------------- Lee2019 (L), 54 users
  - id: L_P0_within_day
    value: {file: results/exp_l/identity_summary.csv, column: ba,
            where: {kind: representation, key: P0, attacker: logistic, scenario: main}}
    format: {kind: fixed, digits: 3}
    text: "0.994"
    in:
      README.md: ["Within-day 0.994 → 0.340 (cross-day 0.520 → 0.054)", "identity BA from 0.994 to 0.340"]
      docs/report.md: ["0.994 identity BA within a day and 0.520 across days", "0.520 rather than 0.994"]
      docs/explainer_ko.md: ["210차원 접공간 특징이 0.994(우연 0.0185)"]
